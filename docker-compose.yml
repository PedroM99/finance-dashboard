services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: myfinance-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host 0.0.0.0

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myfinance-backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://myfinance_user:myfinance_password@postgres:5432/myfinance_db
    depends_on:
      - postgres
    command: npm run dev

  postgres:
    image: postgres:16-alpine
    container_name: myfinance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: myfinance_user
      POSTGRES_PASSWORD: myfinance_password
      POSTGRES_DB: myfinance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: